<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORCA | Marine Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=IBM+Plex+Mono:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">O</div>
          <div class="brand-copy">
            <div class="brand-name">ORCA</div>
            <div class="brand-subtitle">Marine Intelligence Platform</div>
          </div>
        </div>
        <div class="status-box">
          <span class="status-label">System</span>
          <span class="status-pill"><span class="beacon"></span> Online</span>
        </div>
      </header>

      <main class="screen-container">
        <section id="intro-screen" class="screen active">
          <div class="intro-panel">
            <p class="eyebrow">Coastal intelligence for safer decisions</p>
            <h1>ORCA</h1>
            <p class="intro-copy">
              AI-powered marine intelligence for fishers, disaster teams, researchers,
              and coastal authorities.
            </p>

            <div class="persona-grid" id="persona-grid">
              <button class="persona-card" data-persona="Fisherman" type="button">
                <span class="persona-icon">🎣</span>
                <span class="persona-label">Fisherman</span>
              </button>
              <button class="persona-card" data-persona="Disaster Management Agency" type="button">
                <span class="persona-icon">🚨</span>
                <span class="persona-label">Disaster Management Agency</span>
              </button>
              <button class="persona-card" data-persona="Researcher" type="button">
                <span class="persona-icon">🧪</span>
                <span class="persona-label">Researcher</span>
              </button>
              <button class="persona-card" data-persona="Maritime/Coastal Authority" type="button">
                <span class="persona-icon">⚓</span>
                <span class="persona-label">Maritime/Coastal Authority</span>
              </button>
            </div>
          </div>
        </section>

        <section id="chat-screen" class="screen hidden">
          <div class="chat-shell">
            <div class="chat-header">
              <div>
                <p class="eyebrow">Active persona</p>
                <h2 id="persona-label">Fisherman</h2>
              </div>
              <div class="chat-header-actions">
                <button id="new-chat-button" class="secondary-button" type="button">
                  New Chat
                </button>
                <button id="open-history-button" class="secondary-button" type="button">
                  Past conversations
                </button>
                <button id="switch-persona-button" class="secondary-button" type="button">
                  Change persona
                </button>
              </div>
            </div>

            <div class="utility-row">
              <div id="suggestion-row" class="suggestions" aria-live="polite"></div>
              <button id="voice-mute-button" class="icon-button" type="button" aria-label="Mute voice output">
                🔊
              </button>
            </div>

            <div id="example-row" class="example-row" aria-live="polite"></div>

            <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

            <form id="chat-form" class="composer" autocomplete="off">
              <button id="voice-button" class="voice-button" type="button" aria-label="Voice input">🎤</button>
              <select id="location-picker" aria-label="Select coastal location">
                <option value="16.99,73.31" selected>Ratnagiri, Maharashtra</option>
                <option value="9.93,76.26">Kochi, Kerala</option>
                <option value="19.08,72.88">Mumbai, Maharashtra</option>
                <option value="13.08,80.27">Chennai, Tamil Nadu</option>
                <option value="21.17,72.83">Surat, Gujarat</option>
              </select>
              <input
                id="chat-input"
                type="text"
                placeholder="Ask ORCA about conditions, alerts, or fishing zones…"
                aria-label="Chat prompt"
              />
              <button id="send-button" class="primary-button" type="submit">Send</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <div id="detail-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h3 id="modal-title">Response details</h3>
          <button id="close-modal-button" class="secondary-button" type="button">Close</button>
        </div>
        <div id="modal-content" class="modal-content"></div>
      </div>
    </div>

    <div id="history-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-history="true"></div>
      <div class="modal-panel history-panel" role="dialog" aria-modal="true" aria-labelledby="history-title">
        <div class="modal-header">
          <h3 id="history-title">Past conversations</h3>
          <button id="close-history-button" class="secondary-button" type="button">Close</button>
        </div>
        <div id="history-session-list" class="history-list"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="voice.js"></script>
    <script src="mock-examples.js"></script>
    <script src="components.js"></script>
    <script src="app.js"></script>
  </body>
</html>
